#:schema https://developers.openai.com/codex/config-schema.json
# Use the default interactive coding model.
model = "gpt-5.5"
# Use a smaller strong model for review-oriented subagents and review tasks.
review_model = "gpt-5.4"
# Codex has no schema default for this knob; a clean config reports `null`.
# Keep the threshold below the local model catalog context budget so compaction
# can run while there is still room for tool output and the compaction request.
model_auto_compact_token_limit = 200000
# Keep reasoning balanced for day-to-day coding latency and depth.
model_reasoning_effort = "medium"

# Allow reads plus writes inside the active workspace by default.
sandbox_mode = "workspace-write"
# Ask before leaving the sandbox or doing approval-sensitive work.
approval_policy = "on-request"
# Human review for approval-sensitive boundary crossings.
approvals_reviewer = "user"

# Avoid launching a GUI editor from Codex.
file_opener = "none"
# Enable live web search for current documentation and time-sensitive facts.
web_search = "live"

[features]
# Enable durable /goal workflows for long-running tasks with clear stopping conditions.
goals = true
# Keep the Herdr integration enabled; other command hooks are retired.
hooks = true

[tui]
# Let Codex surface terminal notifications when attention is needed.
notifications = true
# Match the existing terminal color theme.
theme = "catppuccin-mocha"
# Match Claude's information categories using native footer fields.
# Tokens are session totals; rate-limit percentages show remaining capacity.
status_line = [
  "model",
  "current-dir",
  "git-branch",
  "used-tokens",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]

[history]
# Keep conversation history available across Codex sessions.
persistence = "save-all"

# Installed first-party runtime catalog, verified against its marketplace.json.
[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/benkim0414/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[otel]
# Label telemetry metadata as local development when telemetry is enabled.
environment = "dev"
# Disable OpenTelemetry export by default.
exporter = "none"
# Disable trace export separately from the general exporter setting.
trace_exporter = "none"
# Prevent user prompts from being included in telemetry payloads.
log_user_prompt = false
